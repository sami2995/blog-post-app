<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center py-4">
        <h1 class="header-title">
          <i class="bi bi-journal-text"></i> My Blog
        </h1>
        <button class="btn btn-outline-light" id="toggleFormBtn">
          <i class="bi bi-plus-circle"></i> New Post
        </button>
      </div>
    </div>
  </header>

  <div class="container my-5">
    <!-- Search and Filter Section -->
    <div class="search-filter-section mb-4">
      <div class="row g-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="searchInput" placeholder="Search blogs by title, content, or author...">
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="sortSelect">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="title">Title A-Z</option>
            <option value="author">Author A-Z</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="filterAuthor">
            <option value="">All Authors</option>
          </select>
        </div>
      </div>
      <div class="mt-3">
        <span id="blogCount" class="badge bg-primary">0 blogs</span>
      </div>
    </div>

    <!-- Blog Form (Collapsible) -->
    <div class="card mb-4" id="blogFormCard" style="display: none;">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
          <i class="bi bi-pencil-square"></i> 
          <span id="formTitle">Create New Blog Post</span>
        </h5>
      </div>
      <div class="card-body">
        <form id="blogForm">
          <input type="hidden" id="blogId">
          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input class="form-control" type="text" id="title" placeholder="Enter blog title" required>
          </div>
          <div class="mb-3">
            <label for="content" class="form-label">Content</label>
            <textarea class="form-control" id="content" rows="6" placeholder="Write your blog content here..." required></textarea>
            <div class="form-text">
              <span id="wordCount">0</span> words | <span id="charCount">0</span> characters
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="author" class="form-label">Author</label>
              <input class="form-control" type="text" id="author" placeholder="Author name" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="tags" class="form-label">Tags (comma-separated)</label>
              <input class="form-control" type="text" id="tags" placeholder="e.g., tech, programming, web">
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit" id="submitBtn">
              <i class="bi bi-check-circle"></i> <span id="submitText">Create Post</span>
            </button>
            <button class="btn btn-secondary" type="button" id="cancelBtn">
              <i class="bi bi-x-circle"></i> Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center my-5" style="display: none;">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="text-center my-5" style="display: none;">
      <i class="bi bi-inbox empty-icon"></i>
      <h3>No blogs found</h3>
      <p class="text-muted">Create your first blog post to get started!</p>
    </div>

    <!-- Blogs Container -->
    <div id="blogsContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirm Delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete this blog post? This action cannot be undone.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="blog.js"></script>
</body>
</html>
